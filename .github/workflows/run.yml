name: RegDrift run
on:
  workflow_dispatch:
  push:
    paths: ["circulars/**", "bots.json", "regdrift.py"]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt reportlab
      - run: python -m unittest -v tests/test_pipeline.py
      - run: python regdrift.py circular_sample.txt
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PROJECT: ${{ secrets.JIRA_PROJECT }}
      - uses: actions/upload-artifact@v4
        with: { name: tickets, path: tickets.json }
