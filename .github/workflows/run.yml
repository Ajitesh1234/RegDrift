name: RegDrift
on:
  push:                        # pushes only run the tests (never create Jira tickets)
    paths: ["**.py", "bots.json", "requirements*.txt", ".github/workflows/run.yml", "data/seed_examples.jsonl"]
  workflow_dispatch:           # the pipeline runs only when you click "Run workflow"
    inputs:
      circular:
        description: "Circular to analyse: a .pdf/.txt path in the repo, or a folder such as circulars/"
        default: "circulars/rbi_fx_derivatives_2026-10-10.pdf"
      dry_run:
        description: "Analyse only, do not create Jira tickets"
        type: boolean
        default: false
      fail_on_high:
        description: "Fail the run if any High-severity (violating) finding exists (compliance gate)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt reportlab
      - run: python -m unittest discover -s tests -v

  run:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - uses: actions/cache@v4            # ChromaDB's embedding model (~80 MB) is downloaded once, then cached
        with: { path: ~/.cache/chroma, key: chroma-minilm-v1 }
      - run: pip install -r requirements.txt
      - name: Run RegDrift
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$FAIL_ON_HIGH" = "true" ]; then ARGS="$ARGS --fail-on-high"; fi
          python regdrift.py "$CIRCULAR" $ARGS
        env:
          CIRCULAR: ${{ inputs.circular }}          # passed via env, never interpolated into the script
          DRY_RUN: ${{ inputs.dry_run }}
          FAIL_ON_HIGH: ${{ inputs.fail_on_high }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PROJECT: ${{ secrets.JIRA_PROJECT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regdrift-reports
          path: |
            reports/
            tickets.json
