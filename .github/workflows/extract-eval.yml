name: Measure rule extraction
on:
  workflow_dispatch:           # runs only when you click "Run workflow"; it never creates Jira tickets
    inputs:
      repeat:
        description: "How many times to read each labelled circular (more runs show how steady the AI is)"
        default: "3"

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Score the extractor against the hand-labelled set
        run: python eval_extract.py --repeat "$REPEAT" --save extract_output.json | tee extract_report.txt
        env:
          REPEAT: ${{ inputs.repeat }}               # via env, never interpolated into the script
          REGDRIFT_RETRIEVER: bow
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-report
          path: |
            extract_report.txt
            extract_output.json
