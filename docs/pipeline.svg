<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="t">
  <title id="t">RegDrift pipeline: ingest, extract, retrieve, reason, act</title>
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <clipPath id="r"><rect width="1280" height="250" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect width="1280" height="250" fill="#0b1224"/>

    <!-- connectors with a moving dash -->
    <g stroke="url(#ac)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 9" fill="none">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.4s" repeatCount="indefinite"/>
      <path d="M229 125H265"/><path d="M485 125H521"/><path d="M741 125H777"/><path d="M997 125H1033"/>
    </g>

    <!-- cards -->
    <g>
      <rect x="28"  y="45" width="200" height="160" rx="16" fill="#111c36" stroke="#22315a"/>
      <rect x="28"  y="45" width="200" height="5" rx="2.5" fill="url(#ac)"/>
      <text x="50" y="86" fill="#2dd4bf" font-size="13" font-weight="800" letter-spacing="2">01 · INGEST</text>
      <text x="50" y="118" fill="#f1f5f9" font-size="19" font-weight="700">Read the circular</text>
      <text x="50" y="146" fill="#94a3b8" font-size="14">PDF, text or paste</text>
      <text x="50" y="167" fill="#94a3b8" font-size="14">Withdrawn stamp, dates</text>
      <text x="50" y="188" fill="#94a3b8" font-size="14">In force today?</text>
    </g>
    <g>
      <rect x="266" y="45" width="220" height="160" rx="16" fill="#111c36" stroke="#22315a"/>
      <rect x="266" y="45" width="220" height="5" rx="2.5" fill="url(#ac)"/>
      <text x="288" y="86" fill="#2dd4bf" font-size="13" font-weight="800" letter-spacing="2">02 · EXTRACT</text>
      <text x="288" y="118" fill="#f1f5f9" font-size="19" font-weight="700">Find the rules</text>
      <text x="288" y="146" fill="#94a3b8" font-size="14">LLM in sections</text>
      <text x="288" y="167" fill="#94a3b8" font-size="14">Validated, never trusted</text>
      <text x="288" y="188" fill="#94a3b8" font-size="14">Skips boilerplate</text>
    </g>
    <g>
      <rect x="522" y="45" width="220" height="160" rx="16" fill="#111c36" stroke="#22315a"/>
      <rect x="522" y="45" width="220" height="5" rx="2.5" fill="url(#ac)"/>
      <text x="544" y="86" fill="#2dd4bf" font-size="13" font-weight="800" letter-spacing="2">03 · RETRIEVE</text>
      <text x="544" y="118" fill="#f1f5f9" font-size="19" font-weight="700">Match the bots</text>
      <text x="544" y="146" fill="#94a3b8" font-size="14">Exact setting match</text>
      <text x="544" y="167" fill="#94a3b8" font-size="14">ChromaDB search</text>
      <text x="544" y="188" fill="#94a3b8" font-size="14">Shared-word gate</text>
    </g>
    <g>
      <rect x="778" y="45" width="220" height="160" rx="16" fill="#111c36" stroke="#22315a"/>
      <rect x="778" y="45" width="220" height="5" rx="2.5" fill="url(#ac)"/>
      <text x="800" y="86" fill="#2dd4bf" font-size="13" font-weight="800" letter-spacing="2">04 · REASON</text>
      <text x="800" y="118" fill="#f1f5f9" font-size="19" font-weight="700">Compare and judge</text>
      <text x="800" y="146" fill="#94a3b8" font-size="14">Arithmetic first</text>
      <text x="800" y="167" fill="#94a3b8" font-size="14">LLM only as fallback</text>
      <text x="800" y="188" fill="#94a3b8" font-size="14">Never a guessed High</text>
    </g>
    <g>
      <rect x="1034" y="45" width="218" height="160" rx="16" fill="#111c36" stroke="#22315a"/>
      <rect x="1034" y="45" width="218" height="5" rx="2.5" fill="url(#ac)"/>
      <text x="1056" y="86" fill="#2dd4bf" font-size="13" font-weight="800" letter-spacing="2">05 · ACT</text>
      <text x="1056" y="118" fill="#f1f5f9" font-size="19" font-weight="700">Raise the ticket</text>
      <text x="1056" y="146" fill="#94a3b8" font-size="14">De-duplicated in Jira</text>
      <text x="1056" y="167" fill="#94a3b8" font-size="14">Severity and clause</text>
      <text x="1056" y="188" fill="#94a3b8" font-size="14">Audit report saved</text>
    </g>
  </g>
</svg>
