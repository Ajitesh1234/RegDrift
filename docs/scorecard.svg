<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" role="img" aria-labelledby="t">
  <title id="t">Measured results: 126 tests, 42 of 42 decision cases, 11 of 11 required rules found, zero cost</title>
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <clipPath id="r"><rect width="1280" height="190" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect width="1280" height="190" fill="#0b1224"/>
    <g>
      <rect x="22" y="22" width="292" height="146" rx="16" fill="#111c36" stroke="#22315a"/>
      <text x="46" y="92" font-size="56" font-weight="800" fill="url(#ac)">126</text>
      <text x="46" y="123" font-size="16" font-weight="700" fill="#f1f5f9">tests pass</text>
      <text x="46" y="146" font-size="13" fill="#94a3b8">run on every push (CI)</text>
    </g>
    <g>
      <rect x="338" y="22" width="292" height="146" rx="16" fill="#111c36" stroke="#22315a"/>
      <text x="362" y="92" font-size="56" font-weight="800" fill="url(#ac)">42/42</text>
      <text x="362" y="123" font-size="16" font-weight="700" fill="#f1f5f9">verdicts correct</text>
      <text x="362" y="146" font-size="13" fill="#94a3b8">hand-labelled decision cases</text>
    </g>
    <g>
      <rect x="654" y="22" width="292" height="146" rx="16" fill="#111c36" stroke="#22315a"/>
      <text x="678" y="92" font-size="56" font-weight="800" fill="url(#ac)">11/11</text>
      <text x="678" y="123" font-size="16" font-weight="700" fill="#f1f5f9">required rules found</text>
      <text x="678" y="146" font-size="13" fill="#94a3b8">in 3 of 3 runs, 5 circulars</text>
    </g>
    <g>
      <rect x="970" y="22" width="288" height="146" rx="16" fill="#111c36" stroke="#22315a"/>
      <text x="994" y="92" font-size="56" font-weight="800" fill="url(#ac)">$0</text>
      <text x="994" y="123" font-size="16" font-weight="700" fill="#f1f5f9">to run end to end</text>
      <text x="994" y="146" font-size="13" fill="#94a3b8">free tiers only</text>
    </g>
  </g>
</svg>
